<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>QR Code Generator</title>
		<meta name="description" content="Free and feature-rich QR code generator" />
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" type="image/png" href="/favicons/favicon.png" />
		<link rel="icon" type="image/x-icon" href="/favicons/favicon.ico" />

		<!-- Open Graph -->
		<meta property="og:site_name" content="QR Code Generator" />
		<meta property="og:title" content="QR Code Generator" />
		<meta property="og:description" content="Free and feature-rich QR code generator" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://qrcode.gautierpicon.com" />
		<meta property="og:image" content="https://qrcode.gautierpicon.com/opengraph.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="QR Code Generator" />
		<meta name="twitter:description" content="Free and feature-rich QR code generator" />
		<meta name="twitter:image" content="https://qrcode.gautierpicon.com/opengraph.png" />

		%sveltekit.head%
	</head>
	<body class="bg-neutral-950" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
